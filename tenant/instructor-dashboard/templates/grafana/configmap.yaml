---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  GF_SECURITY_ADMIN_USER: ansible
  GF_SECURITY_ADMIN_PASSWORD: 'R3dh4t123!'
  GF_DEFAULT_THEME: light
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datasource-config
data:
  prometheus.yml: |
    ---
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      orgId: 1
      url: http://prometheus:9090
      isDefault: true
      version: 1
      editable: true
