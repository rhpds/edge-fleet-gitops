---
apiVersion: v1
kind: Service
metadata:
  name: rhem-on-rhel-webui
spec:
  selector:
    kubevirt.io/domain: rhem-virtual-machine
  ports:
    - protocol: TCP
      port: 443
      targetPort: 443
      name: webui
---
apiVersion: v1
kind: Service
metadata:
  name: rhem-on-rhel-api
spec:
  selector:
    kubevirt.io/domain: rhem-virtual-machine
  ports:
    - protocol: TCP
      port: 6443
      targetPort: 6443
      name: api
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-webui
spec:
  selector:
    kubevirt.io/domain: rhem-virtual-machine
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: webui