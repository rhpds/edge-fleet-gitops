---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhem-on-rhel-webui
spec:
  to:
    kind: Service
    name: rhem-on-rhel-webui
  port:
    targetPort: webui
  tls:
    termination: passthrough
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhem-on-rhel-api
spec:
  to:
    kind: Service
    name: rhem-on-rhel-api
  port:
    targetPort: api
  tls:
    termination: passthrough
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhem-on-rhel-keycloak-webui
spec:
  to:
    kind: Service
    name: keycloak-webui
  port:
    targetPort: webui
  tls: null