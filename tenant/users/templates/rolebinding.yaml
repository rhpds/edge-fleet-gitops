---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.guid }}-oauth-manager
  namespace: openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth-secret-manager
subjects:
  - kind: ServiceAccount
    name: oauth-manager
    namespace: wksp-{{ .Values.guid }}