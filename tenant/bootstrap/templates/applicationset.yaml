---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.guid }}-tenants
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
{{- $userCount := int .Values.user.count }}
{{- range $index := until $userCount }}
      - tenant: {{ $.Values.user.prefix }}{{ add $index 1}} 
{{- end }}
  template:
    metadata:
      name: '{{- "{{" }}.tenant{{- "}}" }}-{{ .Values.guid }}-services'
      namespace: openshift-gitops
      labels:
        guid.rhdp.io: {{ .Values.guid }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source: 
        repoURL: https://github.com/rhpds/edge-fleet-gitops.git
        targetRevision: rh1-2026
        path: tenant/services/
        helm:
          values: |
            gitBranch: rh1-2026
            tenantName: {{ "{{" }}.tenant{{- "}}"}}
            bastionSshPassword: "{{ .Values.bastion_ssh_password }}"
            guid: {{ .Values.guid }}
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
