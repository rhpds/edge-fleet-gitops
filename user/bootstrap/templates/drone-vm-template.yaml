---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.username }}-drone-vm-template
  namespace: openshift-gitops
  labels:
    application: {{ .Values.username }}-drone-vm-template
spec:
  destination:
    name: ''
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    automated: {}
  source:
    repoURL: https://github.com/rhpds/edge-fleet-gitops.git
    targetRevision: rh1-2026
    path: user/drone-vm-template/
    helm:
      values: |
        gitBranch: rh1-2026
        user: {{ .Values.username }}
