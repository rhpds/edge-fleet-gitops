---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.username }}-rhem-virtual-machine
  namespace: openshift-gitops
  labels:
    application: {{ .Values.username }}-rhem-virtual-machine
spec:
  destination:
    name: ''
    server: https://kubernetes.default.svc
    namespace: wksp-{{ .Values.username }}
  project: default
  syncPolicy:
    automated: {}
  source:
    repoURL: https://github.com/rhpds/edge-fleet-gitops.git
    targetRevision: rh1-2026
    path: user/rhem-virtual-machine/
    helm:
      values: |
        gitBranch: rh1-2026
        rhemVirtualMachine:
          password: replacemelater
